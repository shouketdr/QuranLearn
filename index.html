<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widt<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Pro - Final Edition</title>
    <style>
        :root { --primary: #004d40; --secondary: #e0f2f1; --accent: #ffc107; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; height: 100vh; background: #fff; }
        
        /* Sidebar Navigation */
        #sidebar { width: 320px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #fafafa; }
        .sb-header { padding: 20px; background: var(--primary); color: white; }
        .surah-list { overflow-y: auto; flex: 1; }
        .surah-card { padding: 15px 20px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .surah-card:hover { background: var(--secondary); }
        .surah-card.active { background: var(--secondary); border-left: 5px solid var(--primary); }

        /* Main Reading Area */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 10px 25px; border-bottom: 1px solid #eee; display: flex; gap: 10px; align-items: center; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #reader { flex: 1; overflow-y: auto; padding: 20px 40px; scroll-behavior: smooth; background: #fdfdfd; }
        .reader-inner { max-width: 800px; margin: auto; }

        /* Verse Styling */
        .bismillah { text-align: center; font-size: 2.2rem; margin: 30px 0; color: var(--primary); direction: rtl; }
        .ayah-box { padding: 25px 0; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.3s; }
        .ayah-box:hover { background: #f9f9f9; }
        .arabic { font-size: 2.2rem; text-align: right; direction: rtl; line-height: 2.5; color: #222; font-family: "Amiri", serif; }
        .translation { display: none; font-size: 1.1rem; color: #444; line-height: 1.6; padding: 15px; background: #f1f1f1; border-radius: 6px; border-left: 4px solid var(--primary); margin-top: 15px; }
        .ayah-num { font-size: 1rem; color: var(--primary); font-weight: bold; margin-right: 10px; border: 1px solid #ddd; padding: 2px 8px; border-radius: 50%; }

        /* Inputs & Buttons */
        input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .loading { text-align: center; padding: 50px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sb-header">
        <h2 style="margin:0 0 10px 0">Quran Pro</h2>
        <input type="text" id="srchSurah" placeholder="Search Surah..." style="width:100%; box-sizing: border-box;">
    </div>
    <div class="surah-list" id="surahList"></div>
</div>

<div id="main">
    <div class="top-bar">
        <strong id="activeTitle" style="min-width: 150px;">Select a Surah</strong>
        <input type="number" id="jumpAyah" placeholder="Verse No." style="width: 80px">
        <button onclick="jumpToVerse()">Jump</button>
    </div>
    <div id="reader">
        <div class="reader-inner" id="readerInner">
            <div class="loading">Select a Surah to begin reading.</div>
        </div>
    </div>
</div>

<script>
    let allSurahs = [];
    const proxy = "https://corsproxy.io/?"; 

    // Initial Load: Get all 114 Surahs
    async function init() {
        try {
            const url = encodeURIComponent('https://api.quran.com/api/v4/chapters?language=en');
            const res = await fetch(proxy + url);
            const data = await res.json();
            allSurahs = data.chapters;
            renderList(allSurahs);
        } catch (e) {
            document.getElementById('surahList').innerHTML = "<p style='padding:20px'>Failed to load list. Refresh.</p>";
        }
    }

    function renderList(list) {
        const cont = document.getElementById('surahList');
        cont.innerHTML = '';
        list.forEach(s => {
            const d = document.createElement('div');
            d.className = 'surah-card';
            d.id = `card-${s.id}`;
            d.innerHTML = `<div><strong>${s.id}</strong>. ${s.name_simple}</div> <div style="direction:rtl">${s.name_arabic}</div>`;
            d.onclick = () => loadSurah(s.id, s.name_simple);
            cont.appendChild(d);
        });
    }

    // Main Function: Load all verses including pagination for large Surahs
    async function loadSurah(id, name) {
        // Highlight active surah in sidebar
        document.querySelectorAll('.surah-card').forEach(el => el.classList.remove('active'));
        document.getElementById(`card-${id}`).classList.add('active');

        document.getElementById('activeTitle').innerText = name;
        const reader = document.getElementById('readerInner');
        reader.innerHTML = '<div class="loading">Loading verses (this may take a moment for large Surahs)...</div>';
        
        let allVerses = [];
        let currentPage = 1;
        let totalPages = 1;

        try {
            // Loop through all pages provided by the API
            do {
                const apiUrl = `https://api.quran.com/api/v4/verses/by_chapter/${id}?language=en&translations=131&fields=text_uthmani&page=${currentPage}&per_page=50`;
                const res = await fetch(proxy + encodeURIComponent(apiUrl));
                const data = await res.json();
                
                allVerses = allVerses.concat(data.verses);
                totalPages = data.pagination.total_pages;
                currentPage++;
            } while (currentPage <= totalPages);

            renderVerses(allVerses, id);
        } catch (e) {
            reader.innerHTML = `<div style="color:red; text-align:center; padding:50px;">Error loading data. Please check your connection or refresh the page.</div>`;
        }
    }

    function renderVerses(verses, surahId) {
        const reader = document.getElementById('readerInner');
        reader.innerHTML = '';

        // Handle Bismillah (Exclude Surah Fatiha (1) and At-Tawbah (9))
        if (surahId != 1 && surahId != 9) {
            const bism = document.createElement('div');
            bism.className = 'bismillah';
            bism.innerText = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
            reader.appendChild(bism);
        }

        verses.forEach(v => {
            const box = document.createElement('div');
            box.className = 'ayah-box';
            box.id = `v-${v.verse_number}`;
            box.innerHTML = `
                <div class="arabic">
                    <span class="ayah-num">${v.verse_number}</span>${v.text_uthmani}
                </div>
                <div class="translation" id="t-${v.id}">${v.translations[0].text}</div>
            `;
            // Toggle translation on click
            box.onclick = () => {
                const t = document.getElementById(`t-${v.id}`);
                t.style.display = (t.style.display === 'block') ? 'none' : 'block';
            };
            reader.appendChild(box);
        });
    }

    // Feature: Jump to specific verse number
    function jumpToVerse() {
        const val = document.getElementById('jumpAyah').value;
        const target = document.getElementById(`v-${val}`);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.style.transition = "background 0.5s";
            target.style.background = "#fff9c4"; // Highlight color
            setTimeout(() => target.style.background = "transparent", 2000);
        } else {
            alert("Verse not found. Make sure the Surah is fully loaded first.");
        }
    }

    // Search Surah logic
    document.getElementById('srchSurah').oninput = (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allSurahs.filter(s => s.name_simple.toLowerCase().includes(query));
        renderList(filtered);
    };

    init();
</script>

</body>

    let currentSurahVerses = [];

        const res = await fetch('https://api.quran.com/api/v4/chapters?language=en');
        const data = await res.json();
        allSurahs = data.chapters;

    function renderList(list) {

            d.innerHTML = `<div><strong>${s.id}</strong>. ${s.name_simple}</div> <div style="direction:rtl">${s.name_arabic}</div>`;

            cont.appendChild(d);
        });
    }

    async function loadSurah(id, name) {
        document.getElementById('activeTitle').innerText = name;
        const reader = document.getElementById('readerInner');
        reader.innerHTML = '<p style="text-align:center">Loading...</p>';
        
        try {
            const res = await fetch(`https://api.quran.com/api/v4/verses/by_chapter/${id}?language=en&translations=131&fields=text_uthmani`);

            currentSurahVerses = data.verses;
            
            reader.innerHTML = '';
            if (id != 1 && id != 9) {
                reader.innerHTML = `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;

            currentSurahVerses.forEach(v => {
                const box = document.createElement('div');
                box.className = 'ayah-box';
                box.id = `v-${v.verse_number}`;
                box.innerHTML = `
                    <div class="arabic">${v.text_uthmani} <span class="ayah-num">${v.verse_number}</span></div>
                    <div class="translation" id="t-${v.id}">${v.translations[0].text}</div>
                `;
                box.onclick = () => {
                    const t = document.getElementById(`t-${v.id}`);
                    t.style.display = (t.style.display === 'block') ? 'none' : 'block';
                };
                reader.appendChild(box);
            });
        } catch (e) { reader.innerHTML = "Error loading data."; }
    }

    function jumpToVerse() {
        const num = document.getElementById('jumpAyah').value;
        const target = document.getElementById(`v-${num}`);
        if (target) {
            target.scrollIntoView();
            target.style.background = "#fff9c4";
            setTimeout(() => target.style.background = "transparent", 2000);
        } else {
            alert("Verse not found in this Surah.");
        }
    }

    document.getElementById('srchSurah').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        renderList(allSurahs.filter(s => s.name_simple.toLowerCase().includes(val)));
    };

    init();
