<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Pro - Tanzil Engine</title>
    <style>
        :root { --primary: #004d40; --secondary: #e0f2f1; --text: #333; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: #fff; color: var(--text); }
        
        /* Sidebar */
        #sidebar { width: 320px; border-right: 1px solid #eee; display: flex; flex-direction: column; background: #fcfcfc; }
        .sb-header { padding: 20px; background: var(--primary); color: white; }
        .surah-list { overflow-y: auto; flex: 1; }
        .surah-card { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .surah-card:hover { background: var(--secondary); }
        .surah-card.active { background: var(--secondary); border-left: 5px solid var(--primary); }

        /* Main Area */
        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 10px 30px; border-bottom: 1px solid #eee; display: flex; gap: 15px; align-items: center; background: white; }
        #reader { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
        .reader-inner { max-width: 850px; margin: auto; }

        /* Typography */
        .bismillah { text-align: center; font-size: 2.5rem; margin-bottom: 40px; color: var(--primary); direction: rtl; }
        .ayah-box { padding: 30px 0; border-bottom: 1px dotted #ccc; cursor: pointer; }
        .arabic { font-size: 2.4rem; text-align: right; direction: rtl; line-height: 2.8; margin-bottom: 15px; }
        .translation { display: none; font-size: 1.15rem; color: #555; line-height: 1.6; padding: 15px; background: #f4f4f4; border-radius: 8px; border-left: 4px solid var(--primary); }
        
        input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
        .ayah-num { font-size: 1rem; color: var(--primary); font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sb-header">
        <h2 style="margin:0 0 10px 0">Quran Pro</h2>
        <input type="text" id="srchSurah" placeholder="Search Surah..." style="width:100%">
    </div>
    <div class="surah-list" id="surahList"></div>
</div>

<div id="main">
    <div class="top-bar">
        <strong id="activeTitle">Select a Surah</strong>
        <input type="number" id="jumpAyah" placeholder="Verse No." style="width: 80px">
        <button onclick="jumpToVerse()" style="cursor:pointer; background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:4px">Jump</button>
    </div>
    <div id="reader">
        <div class="reader-inner" id="readerInner">
            <div style="text-align:center; margin-top:100px; color:#999">
                Select a Surah from the list to begin reading.
            </div>
        </div>
    </div>
</div>

<script>
    let currentSurahVerses = [];
    let allSurahs = [];

    async function init() {
        const res = await fetch('https://api.quran.com/api/v4/chapters?language=en');
        const data = await res.json();
        allSurahs = data.chapters;
        renderList(allSurahs);
    }

    function renderList(list) {
        const cont = document.getElementById('surahList');
        cont.innerHTML = '';
        list.forEach(s => {
            const d = document.createElement('div');
            d.className = 'surah-card';
            d.innerHTML = `<div><strong>${s.id}</strong>. ${s.name_simple}</div> <div style="direction:rtl">${s.name_arabic}</div>`;
            d.onclick = () => loadSurah(s.id, s.name_simple);
            cont.appendChild(d);
        });
    }

    async function loadSurah(id, name) {
        document.getElementById('activeTitle').innerText = name;
        const reader = document.getElementById('readerInner');
        reader.innerHTML = '<p style="text-align:center">Loading...</p>';
        
        try {
            const res = await fetch(`https://api.quran.com/api/v4/verses/by_chapter/${id}?language=en&translations=131&fields=text_uthmani`);
            const data = await res.json();
            currentSurahVerses = data.verses;
            
            reader.innerHTML = '';
            if (id != 1 && id != 9) {
                reader.innerHTML = `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
            }

            currentSurahVerses.forEach(v => {
                const box = document.createElement('div');
                box.className = 'ayah-box';
                box.id = `v-${v.verse_number}`;
                box.innerHTML = `
                    <div class="arabic">${v.text_uthmani} <span class="ayah-num">${v.verse_number}</span></div>
                    <div class="translation" id="t-${v.id}">${v.translations[0].text}</div>
                `;
                box.onclick = () => {
                    const t = document.getElementById(`t-${v.id}`);
                    t.style.display = (t.style.display === 'block') ? 'none' : 'block';
                };
                reader.appendChild(box);
            });
        } catch (e) { reader.innerHTML = "Error loading data."; }
    }

    function jumpToVerse() {
        const num = document.getElementById('jumpAyah').value;
        const target = document.getElementById(`v-${num}`);
        if (target) {
            target.scrollIntoView();
            target.style.background = "#fff9c4";
            setTimeout(() => target.style.background = "transparent", 2000);
        } else {
            alert("Verse not found in this Surah.");
        }
    }

    document.getElementById('srchSurah').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        renderList(allSurahs.filter(s => s.name_simple.toLowerCase().includes(val)));
    };

    init();
</script>
</body>
</html>
