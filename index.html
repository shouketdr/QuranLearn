<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Pro - Emerald Edition</title>
    <style>
        :root { --primary: #004d40; --secondary: #e0f2f1; --accent: #ffc107; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: #fff; }
        
        #sidebar { width: 320px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #fafafa; }
        .sb-header { padding: 20px; background: var(--primary); color: white; }
        .bookmark-section { padding: 10px 20px; background: #f0f0f0; font-size: 0.9rem; max-height: 150px; overflow-y: auto; border-bottom: 2px solid #ddd; }
        .bookmark-item { padding: 8px; border-bottom: 1px solid #ddd; cursor: pointer; display: flex; justify-content: space-between; background: white; margin-bottom: 5px; border-radius: 4px; }
        
        .surah-list { overflow-y: auto; flex: 1; }
        .surah-card { padding: 15px 20px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .surah-card:hover, .surah-card.active { background: var(--secondary); }

        #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 10px 25px; border-bottom: 1px solid #eee; display: flex; gap: 10px; align-items: center; background: white; }
        #reader { flex: 1; overflow-y: auto; padding: 20px 40px; scroll-behavior: smooth; }
        .reader-inner { max-width: 800px; margin: auto; }

        .bismillah { text-align: center; font-size: 2.2rem; margin: 30px 0; color: var(--primary); direction: rtl; }
        .ayah-box { padding: 25px 0; border-bottom: 1px solid #eee; position: relative; }
        .arabic { font-size: 2.2rem; text-align: right; direction: rtl; line-height: 2.5; color: #222; }
        .translation { display: none; font-size: 1.1rem; color: #444; padding: 15px; background: #f1f1f1; border-left: 4px solid var(--primary); margin-top: 10px; border-radius: 4px; }
        .bookmark-btn { float: left; cursor: pointer; font-size: 1.5rem; color: #ccc; margin-top: 10px; }
        .bookmark-btn.active { color: var(--accent); }
        .ayah-num { font-size: 1rem; color: #888; margin-right: 10px; }
        .loading { text-align: center; padding: 50px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sb-header">
        <h2 style="margin:0">Quran Pro</h2>
        <input type="text" id="srchSurah" placeholder="Search Surah..." style="width:100%; margin-top:10px; padding:8px; border-radius:4px; border:none;">
    </div>
    <div class="bookmark-section">
        <strong>⭐ Bookmarks</strong>
        <div id="bookmarksItems" style="margin-top:10px;">No bookmarks yet.</div>
    </div>
    <div class="surah-list" id="surahList"></div>
</div>

<div id="main">
    <div class="top-bar">
        <strong id="activeTitle" style="min-width:150px;">Select a Surah</strong>
        <input type="number" id="jumpAyah" placeholder="Ayah" style="width:70px; padding:5px;">
        <button onclick="jumpToVerse()" style="background:var(--primary); color:white; border:none; padding:6px 15px; border-radius:4px; cursor:pointer;">Jump</button>
    </div>
    <div id="reader">
        <div class="reader-inner" id="readerInner">
            <div class="loading">Please select a Surah from the sidebar to begin.</div>
        </div>
    </div>
</div>

<script>
    let allSurahs = [];
    let bookmarks = JSON.parse(localStorage.getItem('quranBookmarks')) || [];

    // 1. INITIALIZE LIST
    async function init() {
        renderBookmarks();
        try {
            const res = await fetch('https://api.quran.com/api/v4/chapters?language=en');
            const data = await res.json();
            allSurahs = data.chapters;
            renderList(allSurahs);
        } catch (e) {
            console.error("Init Error:", e);
            document.getElementById('surahList').innerHTML = "<p style='padding:20px'>Connection Error.</p>";
        }
    }

    // 2. LOAD SURAH CONTENT
    async function loadSurah(id, name) {
        document.querySelectorAll('.surah-card').forEach(el => el.classList.remove('active'));
        const activeCard = document.getElementById(`card-${id}`);
        if (activeCard) activeCard.classList.add('active');
        
        document.getElementById('activeTitle').innerText = name;
        const reader = document.getElementById('readerInner');
        reader.innerHTML = '<div class="loading">Loading verses...</div>';
        
        let allVerses = [];
        let page = 1;
        let total = 1;

        try {
            do {
                const url = `https://api.quran.com/api/v4/verses/by_chapter/${id}?language=en&translations=131&fields=text_uthmani&page=${page}&per_page=50`;
                const res = await fetch(url);
                const data = await res.json();
                allVerses = allVerses.concat(data.verses);
                total = data.pagination.total_pages;
                page++;
            } while (page <= total);
            renderVerses(allVerses, id, name);
        } catch (e) { 
            console.error("Load Error:", e);
            reader.innerHTML = "Error loading data."; 
        }
    }

    // 3. RENDER VERSES TO SCREEN
    function renderVerses(verses, sId, sName) {
        const reader = document.getElementById('readerInner');
        reader.innerHTML = (sId != 1 && sId != 9) ? `<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>` : '';

        verses.forEach(v => {
            const isBookmarked = bookmarks.some(b => b.sId == sId && b.vNum == v.verse_number);
            const box = document.createElement('div');
            box.className = 'ayah-box';
            box.id = `v-${v.verse_number}`;
            box.innerHTML = `
                <span class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(${sId}, '${sName}', ${v.verse_number})">★</span>
                <div class="arabic" onclick="toggleTrans(${v.id})">${v.text_uthmani} <span class="ayah-num">(${v.verse_number})</span></div>
                <div class="translation" id="t-${v.id}">${v.translations[0].text}</div>
            `;
            reader.appendChild(box);
        });
    }

    // 4. UI HELPERS
    function toggleTrans(id) {
        const t = document.getElementById(`t-${id}`);
        t.style.display = (t.style.display === 'block') ? 'none' : 'block';
    }

    function toggleBookmark(sId, sName, vNum) {
        const idx = bookmarks.findIndex(b => b.sId == sId && b.vNum == vNum);
        if (idx > -1) bookmarks.splice(idx, 1);
        else bookmarks.push({ sId, sName, vNum });
        
        localStorage.setItem('quranBookmarks', JSON.stringify(bookmarks));
        renderBookmarks();
        // Prevent event bubbling so translation doesn't toggle
        event.stopPropagation();
        event.target.classList.toggle('active');
    }

    function renderBookmarks() {
        const cont = document.getElementById('bookmarksItems');
        if (bookmarks.length === 0) { cont.innerHTML = 'No bookmarks yet.'; return; }
        cont.innerHTML = bookmarks.map(b => `
            <div class="bookmark-item" onclick="goToBookmark(${b.sId}, '${b.sName}', ${b.vNum})">
                <span>${b.sName} (${b.vNum})</span> <span>➜</span>
            </div>
        `).join('');
    }

    async function goToBookmark(sId, sName, vNum) {
        await loadSurah(sId, sName);
        setTimeout(() => {
            const target = document.getElementById(`v-${vNum}`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 800);
    }

    function jumpToVerse() {
        const num = document.getElementById('jumpAyah').value;
        const target = document.getElementById(`v-${num}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function renderList(list) {
        const cont = document.getElementById('surahList');
        cont.innerHTML = '';
        list.forEach(s => {
            const d = document.createElement('div');
            d.className = 'surah-card';
            d.id = `card-${s.id}`;
            d.innerHTML = `<div><strong>${s.id}</strong>. ${s.name_simple}</div><div style="direction:rtl">${s.name_arabic}</div>`;
            d.onclick = () => loadSurah(s.id, s.name_simple);
            cont.appendChild(d);
        });
    }

    document.getElementById('srchSurah').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        renderList(allSurahs.filter(s => s.name_simple.toLowerCase().includes(val)));
    };

    init();
</script>
</body>
</html>
